services:
  postgres:
    image: postgres:17-alpine
    container_name: intelligent-nutrition-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelligent_nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-intelligent_nutrition}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: init

    container_name: intelligent-nutrition-backend-init
    restart: "no"

    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-intelligent_nutrition}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-intelligent_nutrition}?schema=public}"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in the root .env file}

    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: intelligent-nutrition-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-intelligent_nutrition}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-intelligent_nutrition}?schema=public}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_REPLY_TO_EMAIL: ${RESEND_REPLY_TO_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-60}

    ports:
      - "3000:3000"

    depends_on:
      backend-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: intelligent-nutrition-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_MOCK_SESSION: ${VITE_MOCK_SESSION}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS}

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
