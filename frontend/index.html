<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelligent Nutrition</title>
    <script>
      ;(function () {
        var preference = 'system'
        try {
          var stored = localStorage.getItem('intelligent-nutrition:theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch (error) {}
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        var theme = preference === 'system' ? (prefersLight ? 'light' : 'dark') : preference
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
