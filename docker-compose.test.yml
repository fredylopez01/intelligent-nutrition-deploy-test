services:
  smoke-test:
    build:
      context: .
      dockerfile: Dockerfile.smoke
    container_name: intelligent-nutrition-smoke
    profiles: ["smoke"]
    environment:
      BASE_URL: "http://backend:3000"
      FRONTEND_URL: "http://frontend:80"
    depends_on:
      - backend
      - frontend

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: intelligent-nutrition-test-runner
    profiles: ["test"]
    depends_on:
      - postgres